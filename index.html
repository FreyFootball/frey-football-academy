<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frey Football Academy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial, Helvetica, sans-serif;

background:linear-gradient(135deg,#0f172a,#1e293b);

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.container{

text-align:center;

background:rgba(255,255,255,.06);

padding:50px;

border-radius:18px;

width:90%;

max-width:550px;

backdrop-filter:blur(8px);

box-shadow:0 20px 40px rgba(0,0,0,.35);

}

.logo{

font-size:70px;

margin-bottom:15px;

}

h1{

font-size:38px;

margin-bottom:10px;

}

p{

font-size:18px;

opacity:.85;

margin-bottom:40px;

}

.button{

display:block;

width:100%;

padding:18px;

margin:15px 0;

background:white;

color:#111827;

text-decoration:none;

font-size:20px;

font-weight:bold;

border-radius:10px;

transition:.25s;

}

.button:hover{

transform:translateY(-3px);

background:#e5e7eb;

}

.footer{

margin-top:35px;

font-size:14px;

opacity:.7;

}

</style>

</head>
