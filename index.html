<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FFA | Frey Football Academy</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(255, 122, 0, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #181818 0%,
                    #0d0d0d 50%,
                    #050505 100%
                );

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            position: relative;

        }


        /* DEZENTE LICHTEFFEKTE */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    115deg,
                    transparent 35%,
                    rgba(255, 255, 255, 0.025) 45%,
                    transparent 55%
                ),
                linear-gradient(
                    65deg,
                    transparent 35%,
                    rgba(255, 255, 255, 0.02) 45%,
                    transparent 55%
                );

            z-index: 0;

        }


        /* HAUPTBEREICH */

        .container {

            position: relative;

            z-index: 1;

            width: 90%;

            max-width: 650px;

            margin: 0 auto;

            padding: 45px 0 50px;

            text-align: center;

        }


        /* LOGO */

        .logo {

            display: block;

            width: 260px;

            max-width: 75%;

            height: auto;

            margin: 0 auto 45px;

        }


        /* ÜBERSCHRIFT */

        h1 {

            width: 100%;

            margin: 0 auto 15px;

            padding: 0;

            color: white;

            font-size: 38px;

            line-height: 1.2;

            font-weight: 700;

            text-align: center;

        }


        /* UNTERTITEL */

        .subtitle {

            width: 100%;

            margin: 0 auto 45px;

            color: #bbb;

            font-size: 20px;

            line-height: 1.5;

            text-align: center;

        }


        /* BUTTON-BEREICH */

        .buttons {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 16px;

        }


        /* BUTTONS */

        .button {

            display: flex;

            align-items: center;

            justify-content: flex-start;

            width: 82%;

            min-height: 70px;

            padding: 16px 25px;

            background: #ff7a00;

            color: white;

            text-decoration: none;

            border-radius: 12px;

            font-size: 20px;

            font-weight: bold;

            text-align: left;

            transition: 0.2s ease;

        }


        .button:hover {

            background: #ff9500;

            transform: translateY(-2px);

        }


        /* ICON */

        .button-icon {

            width: 35px;

            margin-right: 12px;

            text-align: center;

            font-size: 24px;

            flex-shrink: 0;

        }


        /* FOOTER */

        .footer {

            margin-top: 45px;

            color: #777;

            font-size: 14px;

            text-align: center;

        }


        /* HANDY */

        @media (max-width: 600px) {

            .container {

                width: 90%;

                padding-top: 25px;

            }


            .logo {

                width: 250px;

                max-width: 80%;

                margin-bottom: 40px;

            }


            h1 {

                font-size: 34px;

            }


            .subtitle {

                font-size: 18px;

                margin-bottom: 35px;

            }


            .button {

                width: 90%;

                min-height: 68px;

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- LOGO -->

    <img
        src="assets/logo.png"
        alt="Frey Football Academy Logo"
        class="logo"
    >


    <!-- TITEL -->

    <h1>
        FFA | Frey Football Academy
    </h1>


    <!-- UNTERTITEL -->

    <p class="subtitle">
        Talententwicklung &amp; Coaching
    </p>


 <!-- BUTTONS -->

<div class="buttons">


    <!-- INSTAGRAM -->

    <a
        class="button"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener"
    >

        <span class="button-icon">

            <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                    stroke="white"
                    stroke-width="2"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                    stroke="white"
                    stroke-width="2"
                />

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1.2"
                    fill="white"
                />

            </svg>

        </span>

        <span>
            Folge der FFA auf Instagram
        </span>

    </a>


    <!-- IMPRESSUM -->

    <a
        class="button"
        href="impressum.html"
    >

        <span class="button-icon">

            <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <path
                    d="M6 3H15L19 7V21H6V3Z"
                    stroke="white"
                    stroke-width="2"
                    stroke-linejoin="round"
                />

                <path
                    d="M14 3V8H19"
                    stroke="white"
                    stroke-width="2"
                    stroke-linejoin="round"
                />

                <path
                    d="M9 12H16"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                />

                <path
                    d="M9 16H16"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                />

            </svg>

        </span>

        <span>
            Impressum
        </span>

    </a>


    <!-- DATENSCHUTZERKLÄRUNG -->

    <a
        class="button"
        href="datenschutz.html"
    >

        <span class="button-icon">

            <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <path
                    d="M12 3L19 6V11C19 15.5 16.2 19.2 12 21C7.8 19.2 5 15.5 5 11V6L12 3Z"
                    stroke="white"
                    stroke-width="2"
                    stroke-linejoin="round"
                />

                <path
                    d="M9 12L11 14L15 10"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>

        </span>

        <span>
            Datenschutzerklärung
        </span>

    </a>


</div>

    <!-- FOOTER -->

    <div class="footer">

        © 2026 Frey Football Academy

    </div>


</div>


</body>

</html>
