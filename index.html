<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FFA | Frey Football Academy</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {

        min-height: 100vh;

        overflow-x: hidden;

        background:
            radial-gradient(
                circle at 50% 10%,
                rgba(255, 122, 0, 0.30),
                transparent 30%
            ),
            radial-gradient(
                circle at 10% 80%,
                rgba(255, 122, 0, 0.08),
                transparent 30%
            ),
            linear-gradient(
                180deg,
                #181818 0%,
                #0b0b0b 55%,
                #030303 100%
            );

        color: white;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        position: relative;

    }


    /* =========================================
       ANIMIERTER LICHT-HINTERGRUND
    ========================================= */

    body::before {

        content: "";

        position: fixed;

        inset: -50%;

        pointer-events: none;

        background:
            conic-gradient(
                from 0deg,
                transparent,
                rgba(255, 122, 0, 0.07),
                transparent,
                rgba(255, 255, 255, 0.025),
                transparent
            );

        animation: rotateLight 18s linear infinite;

        z-index: 0;

    }


    body::after {

        content: "";

        position: fixed;

        width: 500px;
        height: 500px;

        left: 50%;
        top: 20%;

        transform: translate(-50%, -50%);

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255, 122, 0, 0.12),
                transparent 65%
            );

        filter: blur(25px);

        animation: pulseGlow 4s ease-in-out infinite;

        pointer-events: none;

        z-index: 0;

    }


    @keyframes rotateLight {

        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }

    }


    @keyframes pulseGlow {

        0%,
        100% {
            opacity: 0.45;
            transform: translate(-50%, -50%) scale(0.9);
        }

        50% {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.15);
        }

    }


    /* =========================================
       SCHWEBENDE LICHTPARTIKEL
    ========================================= */

    .particles {

        position: fixed;

        inset: 0;

        overflow: hidden;

        pointer-events: none;

        z-index: 0;

    }


    .particle {

        position: absolute;

        width: 5px;
        height: 5px;

        background: #ff7a00;

        border-radius: 50%;

        box-shadow:
            0 0 10px #ff7a00,
            0 0 20px rgba(255, 122, 0, 0.6);

        opacity: 0;

        animation: floatParticle linear infinite;

    }


    @keyframes floatParticle {

        0% {
            transform:
                translateY(110vh)
                translateX(0)
                scale(0.4);

            opacity: 0;
        }

        10% {
            opacity: 0.8;
        }

        50% {
            opacity: 1;
        }

        90% {
            opacity: 0.5;
        }

        100% {
            transform:
                translateY(-10vh)
                translateX(80px)
                scale(1.2);

            opacity: 0;
        }

    }


    /* =========================================
       FOOTBALL-EFFEKT
    ========================================= */

    .football {

        position: fixed;

        font-size: 42px;

        opacity: 0.08;

        pointer-events: none;

        z-index: 0;

        animation:
            footballFloat 8s ease-in-out infinite,
            footballRotate 12s linear infinite;

    }


    .football.one {

        left: 5%;
        top: 20%;

    }


    .football.two {

        right: 6%;
        top: 65%;

        font-size: 55px;

        animation-delay: -3s;

    }


    .football.three {

        left: 15%;
        bottom: 8%;

        font-size: 30px;

        animation-delay: -5s;

    }


    @keyframes footballFloat {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-25px);
        }

    }


    @keyframes footballRotate {

        from {
            rotate: 0deg;
        }

        to {
            rotate: 360deg;
        }

    }


    /* =========================================
       HAUPTCONTAINER
    ========================================= */

    .container {

        position: relative;

        z-index: 2;

        width: 90%;

        max-width: 650px;

        margin: 0 auto;

        padding: 55px 0 50px;

        text-align: center;

    }


    /* =========================================
       LOGO
    ========================================= */

    .logo-wrapper {

        position: relative;

        width: fit-content;

        margin: 0 auto 35px;

        animation: logoEntrance 1.2s cubic-bezier(.16,1,.3,1) forwards;

    }


    .logo-wrapper::before {

        content: "";

        position: absolute;

        inset: -30px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255, 122, 0, 0.28),
                transparent 65%
            );

        filter: blur(15px);

        animation: logoGlow 3s ease-in-out infinite;

        z-index: -1;

    }


    .logo {

        display: block;

        width: 260px;

        max-width: 75%;

        height: auto;

        margin: 0 auto;

        filter:
            drop-shadow(0 0 15px rgba(255, 122, 0, 0.25));

        transition:
            transform 0.5s cubic-bezier(.16,1,.3,1),
            filter 0.5s ease;

    }


    .logo:hover {

        transform:
            scale(1.06)
            rotate(-1deg);

        filter:
            drop-shadow(0 0 30px rgba(255, 122, 0, 0.65));

    }


    @keyframes logoEntrance {

        from {

            opacity: 0;

            transform:
                translateY(-40px)
                scale(0.8)
                rotate(-4deg);

        }

        to {

            opacity: 1;

            transform:
                translateY(0)
                scale(1)
                rotate(0);

        }

    }


    @keyframes logoGlow {

        0%,
        100% {
            transform: scale(0.9);
            opacity: 0.5;
        }

        50% {
            transform: scale(1.15);
            opacity: 1;
        }

    }


    /* =========================================
       TITEL
    ========================================= */

    h1 {

        width: 100%;

        margin: 0 auto 12px;

        color: white;

        font-size: 38px;

        line-height: 1.2;

        font-weight: 800;

        text-align: center;

        letter-spacing: -1px;

        animation:
            textEntrance 0.9s 0.25s
            cubic-bezier(.16,1,.3,1)
            both;

    }


    h1::after {

        content: "";

        display: block;

        width: 70px;

        height: 4px;

        margin: 18px auto 0;

        border-radius: 10px;

        background: #ff7a00;

        box-shadow:
            0 0 15px rgba(255, 122, 0, 0.7);

        animation:
            lineGrow 1s 0.7s
            cubic-bezier(.16,1,.3,1)
            both;

    }


    @keyframes textEntrance {

        from {

            opacity: 0;

            transform:
                translateY(25px);

        }

        to {

            opacity: 1;

            transform:
                translateY(0);

        }

    }


    @keyframes lineGrow {

        from {
            width: 0;
        }

        to {
            width: 70px;
        }

    }


    /* =========================================
       SUBTITLE
    ========================================= */

    .subtitle {

        width: 100%;

        margin: 20px auto 42px;

        color: #aaa;

        font-size: 20px;

        line-height: 1.5;

        text-align: center;

        animation:
            textEntrance 0.9s 0.45s
            cubic-bezier(.16,1,.3,1)
            both;

    }


    /* =========================================
       BUTTONS
    ========================================= */

    .buttons {

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 16px;

    }


    .button {

        position: relative;

        display: flex;

        align-items: center;

        justify-content: flex-start;

        width: 82%;

        min-height: 72px;

        padding: 16px 25px;

        overflow: hidden;

        background:
            linear-gradient(
                135deg,
                #ff7a00,
                #ff6200
            );

        color: white;

        text-decoration: none;

        border-radius: 15px;

        font-size: 20px;

        font-weight: bold;

        text-align: left;

        border: 1px solid rgba(255, 255, 255, 0.12);

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.35),
            0 0 0 rgba(255, 122, 0, 0);

        transform: translateY(25px);

        opacity: 0;

        animation:
            buttonEntrance 0.8s
            cubic-bezier(.16,1,.3,1)
            forwards;

        transition:
            transform 0.35s cubic-bezier(.16,1,.3,1),
            box-shadow 0.35s ease,
            background 0.35s ease;

    }


    .button:nth-child(1) {
        animation-delay: 0.65s;
    }

    .button:nth-child(2) {
        animation-delay: 0.8s;
    }

    .button:nth-child(3) {
        animation-delay: 0.95s;
    }


    @keyframes buttonEntrance {

        to {

            opacity: 1;

            transform: translateY(0);

        }

    }


    /* LICHTLAUF */

    .button::before {

        content: "";

        position: absolute;

        top: 0;
        left: -120%;

        width: 70%;

        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );

        transform: skewX(-20deg);

        transition: left 0.6s ease;

    }


    .button:hover::before {

        left: 150%;

    }


    .button:hover {

        transform:
            translateY(-5px)
            scale(1.025);

        background:
            linear-gradient(
                135deg,
                #ff9500,
                #ff6b00
            );

        box-shadow:
            0 15px 35px rgba(0, 0, 0, 0.45),
            0 0 25px rgba(255, 122, 0, 0.35);

    }


    .button:active {

        transform:
            translateY(-1px)
            scale(0.98);

    }


    /* =========================================
       ICON
    ========================================= */

    .button-icon {

        width: 38px;

        margin-right: 14px;

        display: flex;

        align-items: center;

        justify-content: center;

        flex-shrink: 0;

        transition:
            transform 0.35s ease;

    }


    .button:hover .button-icon {

        transform:
            scale(1.18)
            rotate(-5deg);

    }


    .button svg {

        filter:
            drop-shadow(0 0 5px rgba(255, 255, 255, 0.25));

    }


    /* =========================================
       FOOTER
    ========================================= */

    .footer {

        margin-top: 45px;

        color: #666;

        font-size: 14px;

        text-align: center;

        animation:
            textEntrance 1s 1.1s
            cubic-bezier(.16,1,.3,1)
            both;

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

        .container {

            width: 92%;

            padding-top: 30px;

        }


        .logo {

            width: 250px;

            max-width: 80%;

        }


        h1 {

            font-size: 32px;

        }


        .subtitle {

            font-size: 18px;

            margin-bottom: 35px;

        }


        .button {

            width: 94%;

            min-height: 68px;

            font-size: 18px;

            padding: 15px 20px;

        }


        .football {

            font-size: 30px;

        }

    }


    /* =========================================
       REDUCED MOTION
    ========================================= */

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {

            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;

        }

    }

</style>
